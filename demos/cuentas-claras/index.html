<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a5a">
<meta name="description" content="Gastos compartidos sin cuentas: anotá quién pagó qué y la app te dice quién le paga a quién.">
<title>Cuentas Claras</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <button id="back" class="icon-btn hidden" aria-label="Volver">←</button>
    <h1 id="title">Cuentas Claras</h1>
    <button id="menu" class="icon-btn hidden" aria-label="Editar grupo">⚙</button>
  </header>
  <nav id="tabs" class="tabs hidden" role="tablist">
    <button role="tab" data-tab="gastos">Gastos</button>
    <button role="tab" data-tab="saldos">Saldos</button>
    <button role="tab" data-tab="compartir">Compartir</button>
  </nav>
  <main id="view"></main>
  <button id="fab" class="fab hidden" aria-label="Agregar gasto">＋ Gasto</button>
</div>

<div id="sheet-wrap" class="sheet-wrap hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grip"></div>
    <h2 id="sheet-title"></h2>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/qrcode.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
